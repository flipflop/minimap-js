<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimap 2.0 — Code Art Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- highlight.js (vendored locally — no external CDN dependency) -->
  <script src="vendor/highlight.min.js"></script>
</head>
<body>

<header>
  <div class="logo">mini<span>map</span> 2.0</div>
  <div class="tagline">Code → Art · Canvas & Unicode Block Rendering · by Rozario Chivers & Claude Code</div>
</header>

<div class="app">
  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="control-group">
      <label for="theme-select">Syntax Sub Theme (Default)</label>
      <select id="theme-select"></select>
    </div>

    <div class="control-group">
      <label for="lang-select">Language</label>
      <select id="lang-select">
        <option value="auto">Auto-detect</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="csharp">C#</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="ruby">Ruby</option>
        <option value="php">PHP</option>
        <option value="swift">Swift</option>
        <option value="kotlin">Kotlin</option>
        <option value="scala">Scala</option>
        <option value="bash">Bash</option>
        <option value="sql">SQL</option>
        <option value="css">CSS</option>
        <option value="xml">HTML / XML</option>
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="lua">Lua</option>
        <option value="r">R</option>
      </select>
    </div>

    <div class="control-group">
      <label>Render Mode</label>
      <div class="radio-group">
        <label><input type="radio" name="render-mode" value="canvas" checked> PNG Canvas</label>
        <label><input type="radio" name="render-mode" value="ascii"> Unicode Blocks</label>
      </div>
    </div>

    <div class="control-group">
      <label>Character Size (px)</label>
      <div class="size-row">
        <div>
          <label for="char-width" style="font-size:0.65rem">W</label>
          <input type="number" id="char-width" value="3" min="1" max="20">
        </div>
        <div>
          <label for="char-height" style="font-size:0.65rem">H</label>
          <input type="number" id="char-height" value="5" min="1" max="30">
        </div>
        <div>
          <label for="spacing" style="font-size:0.65rem">Gap</label>
          <input type="number" id="spacing" value="1" min="0" max="10">
        </div>
      </div>
    </div>

    <div class="control-group">
      <label>Colour Palette</label>
      <div id="palette-picker" class="palette-picker"></div>
    </div>

    <div class="btn-row">
      <button id="save-png" class="btn btn-secondary" style="flex:1">Save PNG</button>
      <button id="save-ascii" class="btn btn-secondary" style="flex:1">Save ASCII</button>
    </div>

  </aside>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="main">

    <div id="drop-zone" class="drop-zone">
      <div class="icon">📄</div>
      <p>Drop a source code file here, or click to browse</p>
      <div id="file-name" class="file-name"></div>
      <input type="file" id="file-input" hidden accept=".js,.mjs,.cjs,.jsx,.ts,.tsx,.py,.java,.c,.h,.cpp,.cc,.cs,.go,.rs,.rb,.php,.swift,.kt,.scala,.sh,.bash,.sql,.css,.scss,.html,.htm,.xml,.json,.yaml,.yml,.toml,.md,.lua,.r,.txt">
    </div>

    <!-- Side-by-side panels -->
    <div class="panels">

      <!-- Syntax-highlighted source code preview -->
      <section id="code-preview-section" class="code-preview-section" hidden>
        <div class="section-header">
          <span class="section-label">Source Preview</span>
          <span id="code-line-count" class="section-meta"></span>
        </div>
        <pre class="code-preview"><code id="code-preview"></code></pre>
      </section>

      <!-- Minimap output -->
      <section id="minimap-section" class="minimap-section" hidden>
        <div class="section-header">
          <span class="section-label">Minimap Output</span>
          <span id="minimap-dimensions" class="section-meta"></span>
        </div>
        <canvas id="minimap-canvas"></canvas>
        <pre id="minimap-ascii" hidden></pre>
      </section>

    </div>

  </main>
</div>

<footer>
  <span>minimap-js</span>
  <span class="version">v1.5.0</span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
